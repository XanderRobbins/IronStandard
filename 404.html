<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missed rep — Iron Standard</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f0f0d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0f0d'/%3E%3Cpath fill='%23c9a452' d='M6 7h20v4H6zM14 7h4v18h-4zM6 21h20v4H6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100dvh; display: grid; align-content: center; padding-block: var(--s8); position: relative; }
    .lost::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 40%, #000 10%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 40%, #000 10%, transparent 75%);
      opacity: .7;
    }
    .lost .wrap { position: relative; }
    .lost .lost__code { font: 800 clamp(8rem, 30vw, 18rem)/.8 var(--display); color: var(--brass); margin: 0 0 var(--s5) -.04em; }
    .lost h1 { font-size: clamp(2.6rem, 7vw, 4.5rem); margin-bottom: var(--s4); }
    .lost p { color: var(--stone); max-width: 32em; margin-bottom: var(--s6); }
  </style>
</head>
<body>
  <main class="lost">
    <div class="wrap">
      <p class="sec-label"><span>404</span>Page not found</p>
      <p class="lost__code" aria-hidden="true">404</p>
      <h1>Missed rep.</h1>
      <p>This page doesn’t exist, or it moved. No shame in it. Rack the bar, reset, and go again.</p>
      <a href="/" class="btn btn--accent">Back to the program <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a>
    </div>
  </main>
</body>
</html>
